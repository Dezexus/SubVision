[project]
name = "subvision"
version = "1.0.0"
description = "SubVision backend — OCR and blur rendering for hardcoded subtitles"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "numpy>=1.26.0,<3",
    "Pillow>=10.4.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "av>=12.0.0",
    "onnxruntime>=1.19.0",
    "opencv-contrib-python-headless>=4.10.0",
]

[project.optional-dependencies]
worker = [
    "paddleocr>=2.9.0",
    "onnxruntime-gpu>=1.19.0",
]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fakeredis[lua]>=2.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subvision"]

[tool.ruff]
line-length = 200
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "env",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B"
]
ignore = [
    "B008",
    "B904",
    "B007",
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: tests requiring NVIDIA GPU (opt-in)",
]
