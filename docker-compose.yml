services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: subvision_valkey
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: api
    init: true
    container_name: subvision_api
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - subvision_uploads:/app/backend/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0

  worker:
    build:
      context: .
      target: worker
    init: true
    container_name: subvision_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - subvision_uploads:/app/backend/uploads
      - paddle_models:/root/.paddleocr
      - paddlex_cache:/root/.paddlex
    environment:
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - FLAGS_fraction_of_gpu_memory_to_use=0.4
      - FLAGS_allocator_strategy=auto_growth
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - REDIS_URL=redis://redis:6379/0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [compute, utility, video]
    shm_size: '${SHM_SIZE:-2gb}'
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq worker' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    build:
      context: .
      target: web
    container_name: subvision_nginx
    restart: unless-stopped
    ports:
      - "7860:7860"
    depends_on:
      - api
    volumes:
      - subvision_uploads:/app/backend/uploads

volumes:
  paddle_models:
  paddlex_cache:
  subvision_uploads: