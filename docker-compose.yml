services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: subvision_valkey
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: api
    init: true
    container_name: subvision_api
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - subvision_uploads:/app/backend/uploads
      - ./backend:/app/backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - USE_NVDEC=${USE_NVDEC:-true}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-false}
      - HF_TOKEN=${HF_TOKEN:-}
      - EMOTION_EXPORT_ENABLED=${EMOTION_EXPORT_ENABLED:-true}
      - EMOTION_PRELOAD_MODEL=${EMOTION_PRELOAD_MODEL:-false}
      - GIGAAM_MODEL_CACHE_DIR=${GIGAAM_MODEL_CACHE_DIR:-uploads/models/gigaam}

  worker:
    build:
      context: .
      target: worker
      args:
        CUDA_ARCH_BIN: ${CUDA_ARCH_BIN:-7.5}
        INSTALL_EMOTION_DEPS: ${INSTALL_EMOTION_DEPS:-0}
    init: true
    container_name: subvision_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - subvision_uploads:/app/backend/uploads
      - paddle_models:/root/.paddleocr
      - paddlex_cache:/root/.paddlex
      - ./backend:/app/backend
    environment:
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - FLAGS_fraction_of_gpu_memory_to_use=${PADDLE_GPU_MEMORY_FRACTION:-0.35}
      - FLAGS_allocator_strategy=auto_growth
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - USE_NVDEC=${USE_NVDEC:-true}
      - PADDLE_GPU_MEMORY_FRACTION=${PADDLE_GPU_MEMORY_FRACTION:-0.35}
      - PYTHONPATH=/app/backend/third_party/ProPainter
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-false}
      - HF_TOKEN=${HF_TOKEN:-}
      - EMOTION_EXPORT_ENABLED=${EMOTION_EXPORT_ENABLED:-true}
      - EMOTION_PRELOAD_MODEL=${EMOTION_PRELOAD_MODEL:-false}
      - GIGAAM_MODEL_CACHE_DIR=${GIGAAM_MODEL_CACHE_DIR:-uploads/models/gigaam}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [compute, utility, video]
    shm_size: '${SHM_SIZE:-2gb}'
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq worker' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    build:
      context: .
      target: web
    container_name: subvision_nginx
    restart: unless-stopped
    ports:
      - "7860:7860"
    depends_on:
      - api
    volumes:
      - subvision_uploads:/app/backend/uploads

volumes:
  paddle_models:
  paddlex_cache:
  subvision_uploads: